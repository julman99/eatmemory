name: Simple Test CI

on:
  push:
    branches: [ main, master, v* ]
  pull_request:
    branches: [ main, master, v* ]

jobs:
  # Simple multi-platform test
  simple-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Linux setup
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make
    
    # macOS setup  
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        # Xcode command line tools should already be available
        # Just verify gcc and make are available
        which gcc || which clang
        which make
    
    # Windows setup with MSYS2
    - name: Setup MSYS2 (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-make
          make
          bash
    
    # Run the test on Unix systems
    - name: Run simple test (Unix)
      if: runner.os != 'Windows'
      run: bash test/simple.test.sh
    
    # Run the test on Windows with MSYS2 environment
    - name: Run simple test (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: bash test/simple.test.sh

  # Comprehensive Docker-based tests (all cross-platform targets)
  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Docker tests can take a while
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Enable Docker experimental features
      run: |
        set -e
        echo '{"experimental": true}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker
        # Verify Docker is working after restart
        docker --version
        docker info > /dev/null
        
    - name: Run comprehensive test suite
      run: |
        cd test
        bash all.test.sh
   
