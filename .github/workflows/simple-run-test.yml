name: Simple Run Test

on:
  push:
    branches: [main, master, v*]
  pull_request:
    branches: [main, master, v*]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simple-run-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }
          - { os: ubuntu-24.04 }
          - { os: ubuntu-22.04 }
          - { os: ubuntu-latest, extra_cflags: "-m32" } #32-bit x86 via gcc-multilib
          - { os: ubuntu-24.04-arm }
          - { os: ubuntu-22.04-arm }
          - { os: macos-latest }
          - { os: windows-latest }
          - { os: windows-11-arm }

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make ${{ matrix.extra_cflags && 'gcc-multilib' || '' }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          which gcc || which clang
          which make

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            make
            bash

      - name: Run simple test (Unix)
        if: runner.os != 'Windows'
        env:
          EXTRA_CFLAGS: ${{ matrix.extra_cflags }}
        run: bash test/simple.test.sh

      - name: Run simple test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash test/simple.test.sh
