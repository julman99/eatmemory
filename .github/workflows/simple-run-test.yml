name: Simple Run Test

on:
  push:
    branches: [main, master, v*]
  pull_request:
    branches: [main, master, v*]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simple-run-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }
          - { os: ubuntu-24.04 }
          - { os: ubuntu-22.04 }
          - { os: ubuntu-latest, extra_cflags: "-m32" } #32-bit x86 via gcc-multilib
          - { os: ubuntu-24.04-arm }
          - { os: ubuntu-22.04-arm }
          - { os: macos-latest }
          - { os: windows-latest, windows_env: msys2 }
          - { os: windows-latest, windows_env: cygwin }
          - { os: windows-11-arm, windows_env: msys2 }

    runs-on: ${{ matrix.os }}

    steps:
      - name: Use LF line endings for Cygwin
        if: runner.os == 'Windows' && matrix.windows_env == 'cygwin'
        run: git config --global core.autocrlf input

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make ${{ matrix.extra_cflags && 'gcc-multilib' || '' }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          which gcc || which clang
          which make

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows' && matrix.windows_env == 'msys2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            make
            bash

      - name: Setup Cygwin (Windows)
        if: runner.os == 'Windows' && matrix.windows_env == 'cygwin'
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: |
            gcc-core
            git
            make

      - name: Run simple test (Unix)
        if: runner.os != 'Windows'
        env:
          EXTRA_CFLAGS: ${{ matrix.extra_cflags }}
        run: bash test/simple.test.sh

      - name: Run simple test (MSYS2)
        if: runner.os == 'Windows' && matrix.windows_env == 'msys2'
        shell: msys2 {0}
        run: bash test/simple.test.sh

      - name: Run simple test (Cygwin)
        if: runner.os == 'Windows' && matrix.windows_env == 'cygwin'
        run: bash test/simple.test.sh
